<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Creation — RELTAK</title>
<style>
@font-face{font-family:Cinzel;src:url('assets/fonts/Cinzel%5Bwght%5D.ttf') format('truetype-variations');font-weight:100 900;font-display:swap}
:root{--gold:var(--ui-accent,#d4af6a);--gold-bright:var(--ui-accent-bright,#f0d494);--parchment:var(--ui-text,#e8dcc0);color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Cinzel,Georgia,serif;color:var(--parchment);background:#0b1020 url('assets/ui/backgrounds/title-screen-backdrop.png') center/cover fixed no-repeat}
body::before{content:'';position:fixed;inset:0;background:rgba(5,8,18,.75);backdrop-filter:blur(2px);z-index:-1}
main{width:100%;max-width:940px;border:32px solid transparent;border-image:var(--creation-window, url('assets/ui/themes/Astral%20Relics/UI%20components/PNG/Window.png')) 32 fill stretch;padding:4px 20px 10px;filter:drop-shadow(0 12px 28px #0008)}
h1{margin:6px 0 0;text-align:center;font-size:clamp(1.5rem,4vw,2.4rem);letter-spacing:.09em;color:var(--gold-bright);text-shadow:0 2px 8px #000}
.divider{display:block;width:min(320px,90%);height:auto;margin:4px auto 10px}fieldset{border:0;padding:0;margin:12px 0}legend,label{display:block;margin-bottom:6px;font-variant:small-caps;letter-spacing:.14em;color:var(--gold-bright);font-weight:600}
input{width:100%;height:52px;border:20px solid transparent;border-left-width:24px;border-right-width:24px;border-image:var(--creation-text-field-normal, url('assets/ui/themes/Astral%20Relics/UI%20components/PNG/Text%20field%20Normal.png')) 20 24 fill stretch;background-color:transparent;color:var(--parchment);font:inherit;font-size:1rem;padding:0 4px;min-width:0}input:focus{border-image-source:var(--creation-text-field-hover, url('assets/ui/themes/Astral%20Relics/UI%20components/PNG/Text%20field%20Hover.png'))}input::placeholder{color:#c4b99e}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}button,a{font:inherit}button{cursor:pointer}.card{min-width:0;border:32px solid transparent;border-image:var(--creation-card, url('assets/ui/themes/Astral%20Relics/UI%20components/PNG/Card.png')) 32 fill stretch;background:transparent;color:var(--parchment);padding:0;text-align:center;transition:filter .15s,box-shadow .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px}.card strong{color:var(--gold-bright);font-size:1.1rem;letter-spacing:.05em}.card span{font-family:Georgia,serif;font-size:1rem;line-height:1.4}.card img{width:56px;height:56px;object-fit:contain}.card:hover{filter:brightness(1.15)}.card[aria-pressed="true"]{outline:2px solid var(--gold-bright);outline-offset:-5px;box-shadow:0 0 18px #d4af6a88;filter:brightness(1.22)}
.themed{display:inline-flex;align-items:center;justify-content:center;min-height:56px;border:20px solid transparent;border-left-width:24px;border-right-width:24px;border-image:var(--creation-button-normal, url('assets/ui/themes/Astral%20Relics/UI%20components/PNG/Button%20Normal.png')) 20 24 fill stretch;background:transparent;color:var(--gold-bright);text-decoration:none;text-align:center;line-height:1.2;padding:0 12px}.themed:hover{border-image-source:var(--creation-button-hover, url('assets/ui/themes/Astral%20Relics/UI%20components/PNG/Button%20Hover.png'))}.themed:active{border-image-source:var(--creation-button-pressed, url('assets/ui/themes/Astral%20Relics/UI%20components/PNG/Button%20Pressed.png'))}
.begin{width:100%;margin-top:8px;min-height:64px;letter-spacing:.2em;border-image-source:var(--creation-wide-button-normal, url('assets/ui/themes/Astral%20Relics/UI%20components/PNG/Wide%20button%20Normal.png'))}.begin:hover{border-image-source:var(--creation-wide-button-hover, url('assets/ui/themes/Astral%20Relics/UI%20components/PNG/Wide%20button%20Hover.png'))}.begin:active{border-image-source:var(--creation-wide-button-pressed, url('assets/ui/themes/Astral%20Relics/UI%20components/PNG/Wide%20button%20Pressed.png'))}.begin:disabled{border-image-source:var(--creation-wide-button-disabled, url('assets/ui/themes/Astral%20Relics/UI%20components/PNG/Wide%20button%20Disabled.png'));filter:grayscale(.8);color:#aaa294;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold-bright);outline-offset:4px}.summary{text-align:center;padding:40px 0}.summary img{width:112px;height:112px;object-fit:contain}.summary h2{font-size:clamp(1.3rem,4vw,2rem);color:var(--gold-bright);line-height:1.6;overflow-wrap:anywhere}.summary p{font-family:Georgia,serif;line-height:1.5;margin-bottom:32px}footer{max-width:900px;margin:10px auto 0;text-align:center;font-size:.72rem;letter-spacing:.14em;line-height:1.4;color:#e8dcc0b3;text-shadow:0 1px 2px #000}
@media(max-width:600px){body{padding:14px 8px}main{border-width:22px;padding:4px 0 16px}.cards{grid-template-columns:1fr;gap:12px}.card{min-height:112px;border-width:24px;padding:0 6px}.card img{width:64px;height:64px}h1{letter-spacing:.04em}footer{font-size:.65rem}}

[hidden]{display:none!important}.nav{display:flex;justify-content:space-between;gap:16px;margin-top:12px}.themed:disabled{border-image-source:var(--creation-button-disabled, url('assets/ui/themes/Astral%20Relics/UI%20components/PNG/Button%20Disabled.png'));filter:grayscale(1);cursor:not-allowed;color:#aaa294}.custom-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(220px,1fr);gap:24px}.viewport{height:420px;min-width:0;position:relative}.viewport canvas{display:block;width:100%;height:100%;touch-action:none}.hint{font:1rem/1.5 Georgia,serif;color:var(--parchment)}.swatches{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}.swatch{width:26px;height:26px;border-radius:50%;border:1px solid #e8dcc088;background:var(--swatch);padding:0}.swatch[aria-pressed=true]{outline:2px solid var(--gold-bright);outline-offset:3px;transform:scale(1.1)}@media(max-width:650px){.custom-layout{grid-template-columns:1fr}.viewport{height:340px}}
</style>
</head>
<body>
<main>

<header><h1>Character Creation</h1><img class="divider" src="assets/ui/themes/Astral%20Relics/UI%20components/PNG/Divider%20Crest.png" alt="" aria-hidden="true"></header>
<div id="content">
<form id="creation">
<label for="name">Name</label><input id="name" name="name" type="text" maxlength="24" placeholder="Speak your name" autocomplete="off" required>
<fieldset><legend>Race</legend><div class="cards" id="races"></div></fieldset>
<fieldset><legend>Class</legend><div class="cards" id="classes"></div></fieldset>
<nav class="nav" aria-label="Identity navigation"><a class="themed" href="index.html">BACK</a><button class="themed" id="next" type="submit" disabled>NEXT</button></nav>
</form><section id="customization" hidden aria-label="Customization"><div class="custom-layout"><div><div class="viewport" id="viewport" aria-label="Character model turntable"></div><p class="hint">Drag to rotate · Scroll or pinch to zoom</p><p id="model-status" class="hint" role="status"></p></div><div id="palettes"></div></div><nav class="nav" aria-label="Customization navigation"><button class="themed" id="back" type="button">BACK</button><button class="themed" id="begin" type="button">BEGIN</button></nav></section>
</div>
</main>
<footer>Designed and Made by Relic &amp; Ember Studios &mdash; We wake worlds!</footer>
<script type="importmap">{"imports":{"three":"./libs/three/r187/build/three.module.js","three/addons/":"./libs/three/r187/examples/jsm/"}}</script>
<script type="module">
import {loadSettings} from './js/settings.js';
import {applyTheme} from './js/theme.js';
const settings=loadSettings();
const activeTheme=applyTheme(settings.theme);
const canAutoRotate=!settings.reduceMotion && settings.turntableSpeed>0;
// Names audited against all four Component catalogs; fallback is per slot.
const COMPONENT_NAMES=["Window","Text field Normal","Text field Hover","Card","Button Normal","Button Hover","Button Pressed","Wide button Normal","Wide button Hover","Wide button Pressed","Wide button Disabled","Button Disabled","Divider Crest"];
async function applyCreationComponents(){
 const root=document.documentElement;
 const base='assets/ui/themes/'+encodeURIComponent(activeTheme.name)+'/UI%20components/';
 const missing=[];
 if(activeTheme.name==='Astral Relics'){root.dataset.missingThemeAssets='[]';return;}
 let components=[];
 try{const response=await fetch(base+'Component%20catalog.json');if(!response.ok)throw new Error('Catalog '+response.status);components=(await response.json()).components;}catch(error){console.warn('Theme catalog unavailable; keeping Astral Relics components',error);}
 await Promise.all(COMPONENT_NAMES.map(async name=>{
  const piece=components.find(component=>component.name===name);
  if(!piece?.png){missing.push(name);return;}
  const url=base+piece.png.split('/').map(encodeURIComponent).join('/');
  try{
   await new Promise((resolve,reject)=>{const image=new Image();image.onload=resolve;image.onerror=reject;image.src=url;});
   if(name==='Divider Crest')document.querySelector('.divider').src=url;
   else root.style.setProperty('--creation-'+name.toLowerCase().replaceAll(' ','-'),'url("'+url+'")');
  }catch{missing.push(name);}
 }));
 root.dataset.missingThemeAssets=JSON.stringify(missing.sort());
 if(missing.length)console.warn('Astral Relics component fallbacks',missing);
}
applyCreationComponents();
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
const RACES = [ {id:'human', name:'Human', description:'Adaptable and ambitious, at home in every corner of the world.'}, {id:'elf', name:'Elf', description:'Long-lived keepers of the wilds, swift of foot and keen of eye.'}, {id:'orc', name:'Orc', description:'Fierce and unyielding, strength honed by hardship.'} ];
const CLASSES = [ {id:'warrior', name:'Warrior', description:'Front line of any battle: strength, steel, and stubbornness.'}, {id:'ranger', name:'Ranger', description:'A hunter at the edges of the wild: bow, blade, and patience.'}, {id:'mage', name:'Mage', description:'A scholar of the astral currents: power spoken from a distance.'} ];
const ICONS = {warrior:'001%20Star%20sword.png',ranger:'004%20Comet%20bow.png',mage:'006%20Moon%20staff.png'};
const ICON_ROOT = 'assets/ui/themes/Astral%20Relics/Icons/64px/';
const state = {race:null,characterClass:null};
const nameInput = document.getElementById('name');
const next = document.getElementById('next');
function update(){next.disabled = !(nameInput.value.trim() && state.race && state.characterClass);}
function renderCards(items, containerId, key){
 const group = document.getElementById(containerId);
 items.forEach(item => {
  const card = document.createElement('button');
  card.type = 'button'; card.className = 'card'; card.setAttribute('aria-pressed','false');
  if(key === 'characterClass'){
   const image = document.createElement('img'); image.src = ICON_ROOT + ICONS[item.id]; image.alt = ''; card.append(image);
  }
  const title = document.createElement('strong'); title.textContent = item.name;
  const description = document.createElement('span'); description.textContent = item.description;
  card.append(title,description);
  card.addEventListener('click',() => {
   state[key] = item;
   group.querySelectorAll('button').forEach(button => button.setAttribute('aria-pressed', String(button === card)));
   update();
  });
  group.append(card);
 });
}
renderCards(RACES,'races','race');
renderCards(CLASSES,'classes','characterClass');
nameInput.addEventListener('input',update);

const PALETTES={skin:['#f3d8b8','#e8c39e','#dab187','#c99a6d','#b58254','#9c6b42','#81532f','#64401f','#cdb9a2','#a8b98c','#8fae6f','#5f7d44'],hair:['#221c16','#3a2a1c','#5a3d24','#7a4a26','#a35c2c','#c99a4e','#e0c98c','#ede4cf','#9aa3ad','#6e6a63'],primary:['#2b3a55','#4a3a5c','#3e5c3a','#2e5c5c','#7a2e2e','#5c3a24','#8a6d2f','#d8cdb4','#33363b','#6e2a4a','#26506e','#4c3a28'],secondary:['#d4af6a','#f0d494','#b5723a','#a9743c','#c0c4cc','#6e2a2a','#2e7a4f','#6e4a8e','#3a2e24','#d8b34a','#8c8f98','#553a5c'],metal:['#8a8f98','#b0b7c0','#5a5f66','#a9743c','#d4af6a','#2a2c30','#746046','#c9cdd4']};
const MODELS={warrior:'Knight',ranger:'Ranger',mage:'Mage'};
const colors={warrior:{},ranger:{},mage:{}};
const identity=document.getElementById('creation'),custom=document.getElementById('customization'),viewport=document.getElementById('viewport'),status=document.getElementById('model-status');
let renderer,scene,camera,controls,model,loadedClass,parts={},frame=0,request=0,mixer=null,rigClips=null;const clock=new THREE.Clock();
function classify(name){
 const n=name.toLowerCase();
 if(/eye|teeth|mouth/.test(n))return null;
 if(/skin|body|face/.test(n))return 'skin';
 if(/hair/.test(n))return 'hair';
 if(/cloth|shirt|pant|tunic|robe|fabric/.test(n))return 'primary';
 if(/armor|plate|chest|belt|leather|strap/.test(n))return 'secondary';
 if(/metal|steel|iron/.test(n))return 'metal';
 return null;
}
function dispose(root){const geometries=new Set(),materials=new Set(),textures=new Set();root.traverse(o=>{if(o.geometry)geometries.add(o.geometry);if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{materials.add(m);Object.values(m).forEach(v=>{if(v?.isTexture)textures.add(v)});});});geometries.forEach(g=>g.dispose());materials.forEach(m=>m.dispose());textures.forEach(t=>t.dispose());}
function resize(){if(!renderer||custom.hidden)return;const w=viewport.clientWidth,h=viewport.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
function stop(){cancelAnimationFrame(frame);frame=0;}
function animate(){if(custom.hidden||document.hidden){frame=0;return;}const delta=Math.min(clock.getDelta(),.1);if(mixer)mixer.update(delta);controls.update();renderer.render(scene,camera);frame=requestAnimationFrame(animate);}
function resume(){if(renderer&&!frame&&!custom.hidden&&!document.hidden)animate();}
function init(){
 renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,settings.quality==='performance'?1:settings.quality==='balanced'?1.5:Infinity));renderer.setClearColor(0,0);renderer.domElement.setAttribute('aria-label','Rotating character preview');viewport.append(renderer.domElement);
 scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(35,1,.01,100);camera.position.set(0,1.3,4.5);
 scene.add(new THREE.HemisphereLight(0xffe8b5,0x182b50,.9));
 const key=new THREE.DirectionalLight(0xffdfb0,1.2);key.position.set(3,5,4);scene.add(key);
 const rim=new THREE.DirectionalLight(0x8baeff,.4);rim.position.set(-3,3,-4);scene.add(rim);
 controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;controls.autoRotate=canAutoRotate;controls.autoRotateSpeed=1.2*settings.turntableSpeed;controls.enablePan=false;controls.enableZoom=true;controls.minDistance=3;controls.maxDistance=7;
 controls.addEventListener('start',()=>{controls.autoRotate=false;});controls.addEventListener('end',()=>{controls.autoRotate=canAutoRotate;});
 new ResizeObserver(resize).observe(viewport);
}
function renderPalettes(id){
 const target=document.getElementById('palettes');target.replaceChildren();
 for(const part of Object.keys(PALETTES)){
 if(!parts[part]?.length)continue;
 const section=document.createElement('section'),label=document.createElement('h2'),row=document.createElement('div');label.textContent=part[0].toUpperCase()+part.slice(1);label.style.cssText='font-size:1rem;font-variant:small-caps;letter-spacing:.14em;color:var(--gold-bright)';row.className='swatches';
 PALETTES[part].forEach(hex=>{const b=document.createElement('button');b.type='button';b.className='swatch';b.style.setProperty('--swatch',hex);b.setAttribute('aria-label',part+' '+hex);b.setAttribute('aria-pressed',String(colors[id][part]===hex));b.addEventListener('click',()=>{colors[id][part]=hex;parts[part].forEach(m=>m.color.set(hex));row.querySelectorAll('button').forEach(s=>s.setAttribute('aria-pressed',String(s===b)));});row.append(b);});section.append(label,row);target.append(section);
 }
 if(!Object.keys(parts).length){const note=document.createElement('p');note.className='hint';note.textContent='This model uses a shared texture atlas, with no safely named color parts. Original colors are preserved to protect details such as eyes.';target.append(note);}
}
async function enter(){
 identity.hidden=true;custom.hidden=false;document.querySelector('h1').textContent='Customization';document.getElementById('back').focus();
 try{
 if(!renderer)init();resize();resume();const id=state.characterClass.id;if(loadedClass===id)return;
 const ticket=++request;loadedClass=null;parts={};document.getElementById('palettes').replaceChildren();status.textContent='Loading '+state.characterClass.name+'…';if(mixer){mixer.stopAllAction();mixer=null;}if(model){scene.remove(model);dispose(model);model=null;}
 const gltf=await new GLTFLoader().loadAsync('assets/characters/adventurers/'+MODELS[id]+'.glb'); if(rigClips===null){try{const rig=await new GLTFLoader().loadAsync('assets/characters/adventurers/Rig_Medium_General.glb');rigClips=rig.animations&&rig.animations.length?rig.animations:[];console.info('Rig clips',rigClips.map(clip=>clip.name));}catch(error){console.warn('Rig file not loaded, model stays in T-pose',error);}}
 if(ticket!==request){dispose(gltf.scene);return;}
 model=gltf.scene;const mapping=[],unknown=new Set();
 model.traverse(o=>{if(!o.isMesh)return;const clone=m=>{const c=m.clone(),part=classify(m.name);mapping.push({mesh:o.name,material:m.name,part:part||'unchanged'});if(part&&c.color){(parts[part]??=[]).push(c);if(colors[id][part])c.color.set(colors[id][part]);}else unknown.add(m.name||'(unnamed)');return c;};o.material=Array.isArray(o.material)?o.material.map(clone):clone(o.material);});
 const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());const scale=2/(size.y||1);model.scale.multiplyScalar(scale);model.position.sub(center.multiplyScalar(scale));model.position.y+=1;scene.add(model);loadedClass=id;if(rigClips.length){mixer=new THREE.AnimationMixer(model);const idle=rigClips.find(clip=>clip.name==='Idle_A')||rigClips.find(clip=>clip.name.toLowerCase().includes('idle'))||rigClips[0];mixer.clipAction(idle).play();console.info('Playing',idle.name);}else mixer=null;camera.position.set(0,1.3,4.5);controls.target.set(0,1,0);controls.update();renderPalettes(id);status.textContent=state.characterClass.name+' ready. Original colors until a swatch is chosen.';console.info('Character material mapping',id,mapping,'Unclassified:',[...unknown]);
 }catch(error){status.textContent='Preview unavailable. Go back and try again, or begin your tale without it.';console.error('Character preview failed',error);}
}
identity.addEventListener('submit',event=>{event.preventDefault();update();if(!next.disabled)enter();});
document.getElementById('back').addEventListener('click',()=>{++request;stop();custom.hidden=true;identity.hidden=false;document.querySelector('h1').textContent='Character Creation';next.focus();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else resume();});
window.addEventListener('pagehide',()=>{stop();++request;if(mixer){mixer.stopAllAction();mixer=null;}if(model)dispose(model);controls?.dispose();renderer?.dispose();});
document.getElementById('begin').addEventListener('click',() => {
 const character={name:nameInput.value.trim(),race:state.race.name,class:state.characterClass.name};
 try{localStorage.setItem('reltak.character',JSON.stringify(character));}
 catch{status.textContent='Character could not be saved. Enable browser storage and try BEGIN again.';return;}
 location.href='game.html';
});
</script>
</body>
