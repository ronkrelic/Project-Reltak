.0 450.00000000000006L790.0 450.00000000000006" fill="none" stroke="#dfb46a" stroke-width="0.7" opacity="0.1"/><path d="M992.1539030917347 330.0L844.9295844483802 244.99999999999994" fill="none" stroke="#dfb46a" stroke-width="0.7" opacity="0.1"/><path d="M1080.0 242.15390309173478L994.9999999999998 94.92958444838024" fill="none" stroke="#dfb46a" stroke-width="0.7" opacity="0.1"/><path d="M1200.0 210.0L1200.0 40.0" fill="none" stroke="#dfb46a" stroke-width="0.7" opacity="0.1"/><path d="M1320.0 242.15390309173475L1405.0 94.92958444838018" fill="none" stroke="#dfb46a" stroke-width="0.7" opacity="0.1"/><path d="M1407.8460969082653 329.9999999999999L1555.0704155516198 244.99999999999983" fill="none" stroke="#dfb46a" stroke-width="0.7" opacity="0.1"/><g transform="translate(800 270) scale(2.8)"><path d="M-25 -12L-15 17L15 17L25 -12L12 -2L0 -23L-12 -2Z" fill="url(#metal)" stroke="#dfb46a" stroke-width="2" opacity="1"/><path d="M-17 22L17 22" fill="none" stroke="#dfb46a" stroke-width="3" opacity="1"/><path d="M0 -3L5 2L0 7L-5 2Z" fill="#be3b44" stroke="#dfb46a" stroke-width="1.5" opacity="1"/></g><text x="800" y="450" fill="#fff0d2" font-family="DejaVu Serif" font-size="30" text-anchor="middle" font-weight="400" opacity="1">The Keeper</text><g opacity="1"><path d="M122 526H1478L1489 537V823L1478 834H122L111 823V537Z" fill="url(#surface)" stroke="#dfb46a" stroke-width="3" opacity="1"/><rect x="117" y="532" width="1366" height="296" rx="2" fill="none" stroke="#dfb46a" stroke-width="0.75" opacity="0.5"/><circle cx="126" cy="541" r="2.4" fill="#dfb46a" stroke="none" stroke-width="1" opacity="1"/><circle cx="1474" cy="541" r="2.4" fill="#dfb46a" stroke="none" stroke-width="1" opacity="1"/><circle cx="126" cy="819" r="2.4" fill="#dfb46a" stroke="none" stroke-width="1" opacity="1"/><circle cx="1474" cy="819" r="2.4" fill="#dfb46a" stroke="none" stroke-width="1" opacity="1"/></g><text x="150" y="578" fill="#dfb46a" font-family="DejaVu Sans" font-size="17" text-anchor="start" font-weight="600" opacity="1">THE KEEPER</text><text x="150" y="626" fill="#fff0d2" font-family="DejaVu Sans" font-size="24" text-anchor="start" font-weight="400" opacity="1">The path ahead is quiet, but the old stones remember.</text><text x="150" y="657" fill="#fff0d2" font-family="DejaVu Sans" font-size="24" text-anchor="start" font-weight="400" opacity="1">Will you help me bring the lost relic home?</text><g opacity="1"><path d="M160.8 741H529.2L539 750.8V783.2L529.2 793H160.8L151 783.2V750.8Z" fill="url(#active)" stroke="#dfb46a" stroke-width="3" opacity="1"/><rect x="157" y="747" width="376" height="40" rx="2" fill="none" stroke="#dfb46a" stroke-width="0.75" opacity="0.5"/><circle cx="166" cy="756" r="2.4" fill="#dfb46a" stroke="none" stroke-width="1" opacity="1"/><circle cx="524" cy="756" r="2.4" fill="#dfb46a" stroke="none" stroke-width="1" opacity="1"/><circle cx="166" cy="778" r="2.4" fill="#dfb46a" stroke="none" stroke-width="1" opacity="1"/><circle cx="524" cy="778" r="2.4" fill="#dfb46a" stroke="none" stroke-width="1" opacity="1"/><rect x="160" y="750" width="370" height="34" rx="2" fill="none" stroke="#fff0d2" stroke-width="0.7" opacity="0.4"/></g><text x="345.0" y="774.0" fill="#fff0d2" font-family="DejaVu Sans" font-size="19" text-anchor="middle" font-weight="600" opacity="1">I will find it.</text><g opacity="1"><path d="M570.8 741H939.2L949 750.8V783.2L939.2 793H570.8L561 783.2V750.8Z" fill="url(#surface)" stroke="#dfb46a" stroke-width="3" opacity="1"/><rect x="567" y="747" width="376" height="40" rx="2" fill="none" stroke="#dfb46a" stroke-width="0.75" opacity="0.5"/><circle cx="576" cy="756" r="2.4" fill="#dfb46a" stroke="none" stroke-width="1" opacity="1"/><circle cx="934" cy="756" r="2.4" fill="#dfb46a" stroke="none" stroke-width="1" opacity="1"/><circle cx="576" cy="778" r="2.4" fill="#dfb46a" stroke="none" stroke-width="1" opacity="1"/><circle cx="934" cy="778" r="2.4" fill="#dfb46a" stroke="none" stroke-width="1" opacity="1"/></g><text x="755.0" y="774.0" fill="#fff0d2" font-family="DejaVu Sans" font-size="19" text-anchor="middle" font-weight="600" opacity="1">Tell me more.</text><g opacity="1"><path d="M980.8 741H1434.2L1444 750.8V783.2L1434.2 793H980.8L971 783.2V750.8Z" fill="url(#surface)" stroke="#dfb46a" stroke-width="3" opacity="1"/><rect x="977" y="747" width="461" height="40" rx="2" fill="none" stroke="#dfb46a" stroke-width="0.75" opacity="0.5"/><circle cx="986" cy="756" r="2.4" fill="#dfb46a" stroke="none" stroke-width="1" opacity="1"/><circle cx="1429" cy="756" r="2.4" fill="#dfb46a" stroke="none" stroke-width="1" opacity="1"/><circle cx="986" cy="778" r="2.4" fill="#dfb46a" stroke="none" stroke-width="1" opacity="1"/><circle cx="1429" cy="778" r="2.4" fill="#dfb46a" stroke="none" stroke-width="1" opacity="1"/></g><text x="1207.5" y="774.0" fill="#fff0d2" font-family="DejaVu Sans" font-size="19" text-anchor="middle" font-weight="600" opacity="1">I need time to prepare.</text></svg>