14 -20" fill="none" stroke="#d9b977" stroke-width="1" opacity="1"/></g></g><g transform="translate(800 270) scale(2.8)"><circle cx="0" cy="0" r="23" fill="#2c4939" stroke="#d9b977" stroke-width="2" opacity="1"/><g transform="translate(-12 12) rotate(0) scale(1.2)"><path d="M0 0C-3 -12 7 -23 17 -24C19 -12 11 -2 0 0Z" fill="#8eaf67" stroke="#d9b977" stroke-width="1" opacity="1"/><path d="M0 0L14 -20" fill="none" stroke="#d9b977" stroke-width="1" opacity="1"/></g><g transform="translate(12 12) rotate(-45) scale(0.9)"><path d="M0 0C-3 -12 7 -23 17 -24C19 -12 11 -2 0 0Z" fill="#8eaf67" stroke="#d9b977" stroke-width="1" opacity="1"/><path d="M0 0L14 -20" fill="none" stroke="#d9b977" stroke-width="1" opacity="1"/></g><circle cx="4" cy="-3" r="6" fill="#d9b977" stroke="none" stroke-width="1" opacity="1"/></g><text x="800" y="450" fill="#fff3d4" font-family="DejaVu Serif" font-size="30" text-anchor="middle" font-weight="400" opacity="1">The Keeper</text><g opacity="1"><rect x="111" y="528" width="1378" height="306" rx="20" fill="#101e1b" stroke="none" stroke-width="1" opacity="1"/><rect x="112" y="527" width="1376" height="304" rx="20" fill="url(#surface)" stroke="#d9b977" stroke-width="3" opacity="1"/><rect x="116" y="531" width="1368" height="298" rx="16" fill="none" stroke="#d9b977" stroke-width="1" opacity="0.45"/><g transform="translate(118 552) rotate(40) scale(0.65)"><path d="M0 0C-3 -12 7 -23 17 -24C19 -12 11 -2 0 0Z" fill="#8eaf67" stroke="#d9b977" stroke-width="1" opacity="1"/><path d="M0 0L14 -20" fill="none" stroke="#d9b977" stroke-width="1" opacity="1"/></g><g transform="translate(1478 825) rotate(-140) scale(0.65)"><path d="M0 0C-3 -12 7 -23 17 -24C19 -12 11 -2 0 0Z" fill="#8eaf67" stroke="#d9b977" stroke-width="1" opacity="1"/><path d="M0 0L14 -20" fill="none" stroke="#d9b977" stroke-width="1" opacity="1"/></g></g><text x="150" y="578" fill="#d9b977" font-family="DejaVu Sans" font-size="17" text-anchor="start" font-weight="600" opacity="1">THE KEEPER</text><text x="150" y="626" fill="#fff3d4" font-family="DejaVu Sans" font-size="24" text-anchor="start" font-weight="400" opacity="1">The path ahead is quiet, but the old stones remember.</text><text x="150" y="657" fill="#fff3d4" font-family="DejaVu Sans" font-size="24" text-anchor="start" font-weight="400" opacity="1">Will you help me bring the lost relic home?</text><g opacity="1"><rect x="151" y="743" width="388" height="50" rx="13.5" fill="#101e1b" stroke="none" stroke-width="1" opacity="1"/><rect x="152" y="742" width="386" height="48" rx="13.5" fill="url(#active)" stroke="#d9b977" stroke-width="3" opacity="1"/><rect x="156" y="746" width="378" height="42" rx="9.5" fill="none" stroke="#d9b977" stroke-width="1" opacity="0.45"/><rect x="160" y="750" width="370" height="34" rx="2" fill="none" stroke="#fff3d4" stroke-width="0.7" opacity="0.4"/></g><text x="345.0" y="774.0" fill="#fff3d4" font-family="DejaVu Sans" font-size="19" text-anchor="middle" font-weight="600" opacity="1">I will find it.</text><g opacity="1"><rect x="561" y="743" width="388" height="50" rx="13.5" fill="#101e1b" stroke="none" stroke-width="1" opacity="1"/><rect x="562" y="742" width="386" height="48" rx="13.5" fill="url(#surface)" stroke="#d9b977" stroke-width="3" opacity="1"/><rect x="566" y="746" width="378" height="42" rx="9.5" fill="none" stroke="#d9b977" stroke-width="1" opacity="0.45"/></g><text x="755.0" y="774.0" fill="#fff3d4" font-family="DejaVu Sans" font-size="19" text-anchor="middle" font-weight="600" opacity="1">Tell me more.</text><g opacity="1"><rect x="971" y="743" width="473" height="50" rx="13.5" fill="#101e1b" stroke="none" stroke-width="1" opacity="1"/><rect x="972" y="742" width="471" height="48" rx="13.5" fill="url(#surface)" stroke="#d9b977" stroke-width="3" opacity="1"/><rect x="976" y="746" width="463" height="42" rx="9.5" fill="none" stroke="#d9b977" stroke-width="1" opacity="0.45"/></g><text x="1207.5" y="774.0" fill="#fff3d4" font-family="DejaVu Sans" font-size="19" text-anchor="middle" font-weight="600" opacity="1">I need time to prepare.</text></svg>